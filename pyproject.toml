[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thessla-green-modbus"
version = "2.8.3"
description = "ThesslaGreen Modbus integration for Home Assistant"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ThesslaGreen Modbus Integration", email = "thesslagreen@users.noreply.github.com"}
]
keywords = ["home-assistant", "modbus", "hvac", "thesslagreen", "airpack"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
requires-python = ">=3.13"
dependencies = ["pymodbus>=3.6.1,<4.0", "voluptuous>=0.13"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=1.2.0",
    "pytest-homeassistant-custom-component>=0.13.309,<0.13.317",
    "aiodhcpwatcher>=1.1.0",
    "aiodiscover>=2.6.1",
    "PyYAML>=6.0",
    "voluptuous>=0.13.1",
    "black>=24.4.0",
    "isort>=5.13.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    # pytest-homeassistant-custom-component 0.13.309-0.13.316 pins pydantic==2.12.2;
    # keep in sync with requirements-dev.txt to avoid pip conflicts in CI.
    "pydantic==2.12.2",
    "pre-commit>=3.7.0",
    "types-PyYAML>=6.0.12",
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: integration tests requiring a live Home Assistant instance",
]
filterwarnings = [
    "ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.thessla_green_modbus"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["custom_components.thessla_green_modbus"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["pymodbus.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["custom_components/thessla_green_modbus"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.xml]
output = "coverage.xml"
