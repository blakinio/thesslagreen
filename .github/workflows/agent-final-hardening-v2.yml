name: One-shot final hardening runner v2

on:
  push:
    branches: ["fix/ha-integration-hardening-20260810"]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ha-integration-hardening-20260810

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Install verification toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
          python -m pip install homeassistant==2026.2.3 hacs

      - name: Extract and apply bounded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(".github/workflows/agent-apply-final-hardening.yml").read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n          ruff format"
          start = source.find(start_marker)
          end = source.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit("Unable to extract bounded patch from v1 workflow")
          block = source[start + len(start_marker) : end]
          lines = []
          for line in block.splitlines():
              if line.startswith("          "):
                  line = line[10:]
              lines.append(line)
          Path("/tmp/final_hardening_patch.py").write_text("\n".join(lines) + "\n")
          PY
          python /tmp/final_hardening_patch.py
          ruff format custom_components/thessla_green_modbus/fan.py tests/test_fan.py tests/test_scan_safe_mode.py
          ruff check --output-format=github custom_components/thessla_green_modbus/fan.py tests/test_fan.py tests/test_scan_safe_mode.py
          git diff --check

      - name: Verify focused regressions
        run: pytest -q tests/test_fan.py tests/test_scan_safe_mode.py tests/test_scan_service_isolation.py

      - name: Commit verified hardening
        shell: bash
        run: |
          rm .github/workflows/agent-apply-final-hardening.yml
          rm .github/workflows/agent-final-hardening-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/thessla_green_modbus/fan.py tests/test_fan.py tests/test_scan_safe_mode.py .github/workflows/agent-apply-final-hardening.yml .github/workflows/agent-final-hardening-v2.yml
          git diff --cached --check
          git commit -m "fix: eliminate remaining fan no-op write paths"
          git push origin HEAD:fix/ha-integration-hardening-20260810
