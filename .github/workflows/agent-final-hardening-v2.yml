name: One-shot final hardening runner v2

on:
  push:
    branches: ["fix/ha-integration-hardening-20260810"]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ha-integration-hardening-20260810

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Install verification toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
          python -m pip install homeassistant==2026.2.3 hacs

      - name: Extract and apply bounded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(".github/workflows/agent-apply-final-hardening.yml").read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n          ruff format"
          start = source.find(start_marker)
          end = source.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit("Unable to extract bounded patch from v1 workflow")
          block = source[start + len(start_marker) : end]
          lines = []
          for line in block.splitlines():
              if line.startswith("          "):
                  line = line[10:]
              lines.append(line)
          Path("/tmp/final_hardening_patch.py").write_text("\n".join(lines) + "\n")
          PY
          python /tmp/final_hardening_patch.py

          python - <<'PY'
          from pathlib import Path
          import re

          fan_path = Path("custom_components/thessla_green_modbus/fan.py")
          lines = fan_path.read_text().splitlines()
          generated_methods = (
              "    def _validate_percentage_write_path(",
              "    async def async_turn_on(",
              "    async def async_turn_off(",
              "    async def async_set_percentage(",
              "    async def _write_register(",
          )

          index = 0
          fixed = 0
          while index < len(lines):
              if lines[index].startswith(generated_methods):
                  fixed += 1
                  index += 1
                  while index < len(lines) and not (
                      lines[index].startswith("    def ")
                      or lines[index].startswith("    async def ")
                  ):
                      if lines[index].strip():
                          lines[index] = "    " + lines[index]
                      index += 1
                  continue
              index += 1

          if fixed != len(generated_methods):
              raise SystemExit(
                  f"Expected to repair {len(generated_methods)} generated methods, repaired {fixed}"
              )

          fan_text = "\n".join(lines) + "\n"
          fan_text = fan_text.replace(
              "except (ModbusException, ConnectionException, TimeoutError, OSError) as exc:",
              "except (ModbusException, ConnectionException, TimeoutError, OSError, RuntimeError) as exc:",
          )
          fan_path.write_text(fan_text)

          fan_tests_path = Path("tests/test_fan.py")
          fan_tests = fan_tests_path.read_text()
          old = '''def test_fan_write_register_invalid_raises(mock_coordinator):
              """_write_register raises ValueError for unknown register names (line 278)."""
              fan = ThesslaGreenFan(mock_coordinator)
              with pytest.raises(ValueError):
                  asyncio.run(fan._write_register("nonexistent_xyz_register_99", 1))'''
          new = '''def test_fan_write_register_invalid_raises(mock_coordinator):
              """_write_register rejects unknown register names as invalid HA actions."""
              fan = ThesslaGreenFan(mock_coordinator)
              with pytest.raises(ServiceValidationError):
                  asyncio.run(fan._write_register("nonexistent_xyz_register_99", 1))'''
          if fan_tests.count(old) != 1:
              raise SystemExit("fan invalid-register test did not match exactly once")
          fan_tests_path.write_text(fan_tests.replace(old, new))

          scan_path = Path("tests/test_scan_safe_mode.py")
          scan = scan_path.read_text()
          marker = '''# ---------------------------------------------------------------------------
          # validate_known_registers — must not call scanner_create (no second connection)
          # ---------------------------------------------------------------------------'''
          helper = '''def _modbus_error_response():
              """Return an explicit device-side Modbus error response."""
              response = MagicMock()
              response.registers = []
              response.bits = []
              response.isError.return_value = True
              return response


          '''
          if scan.count(marker) != 1:
              raise SystemExit("validate helper insertion marker did not match exactly once")
          scan = scan.replace(marker, helper + marker, 1)

          old_import = "from pymodbus.exceptions import ConnectionException, ModbusException"
          if scan.count(old_import) != 1:
              raise SystemExit("individual fallback import did not match exactly once")
          scan = scan.replace(old_import, "from pymodbus.exceptions import ModbusException", 1)

          old_individual = 'if addr == 1:\n            raise ConnectionException("addr 1 unsupported")'
          if scan.count(old_individual) != 1:
              raise SystemExit("individual unsupported read did not match exactly once")
          scan = scan.replace(
              old_individual,
              'if addr == 1:\n            return _modbus_error_response()',
              1,
          )

          explicit_pattern = re.compile(
              r'coord\.device_client\._call_modbus\s*=\s*AsyncMock\(\s*'
              r'side_effect=ModbusException\("device does not support this register"\)\s*\)'
          )
          scan, count = explicit_pattern.subn(
              "coord.device_client._call_modbus = AsyncMock(return_value=_modbus_error_response())",
              scan,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"explicit unsupported test expected one match, got {count}")

          unsupported_pattern = re.compile(
              r'AsyncMock\(\s*side_effect=ModbusException\("unsupported"\)\s*\)'
          )
          scan, count = unsupported_pattern.subn(
              "AsyncMock(return_value=_modbus_error_response())",
              scan,
          )
          if count < 4:
              raise SystemExit(f"expected at least four legacy unsupported stubs, got {count}")

          scan_path.write_text(scan)
          PY

          ruff format custom_components/thessla_green_modbus/fan.py tests/test_fan.py tests/test_scan_safe_mode.py
          ruff check --fix custom_components/thessla_green_modbus/fan.py tests/test_fan.py tests/test_scan_safe_mode.py
          ruff format custom_components/thessla_green_modbus/fan.py tests/test_fan.py tests/test_scan_safe_mode.py
          ruff check --output-format=github custom_components/thessla_green_modbus/fan.py tests/test_fan.py tests/test_scan_safe_mode.py
          git diff --check

      - name: Verify focused regressions
        run: pytest -q tests/test_fan.py tests/test_scan_safe_mode.py tests/test_scan_service_isolation.py

      - name: Commit verified hardening
        shell: bash
        run: |
          rm .github/workflows/agent-apply-final-hardening.yml
          rm .github/workflows/agent-final-hardening-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/thessla_green_modbus/fan.py tests/test_fan.py tests/test_scan_safe_mode.py .github/workflows/agent-apply-final-hardening.yml .github/workflows/agent-final-hardening-v2.yml
          git diff --cached --check
          git commit -m "fix: eliminate remaining fan no-op write paths"
          git push origin HEAD:fix/ha-integration-hardening-20260810
