name: Temporary CI contract fix

on:
  push:
    branches:
      - fix/ha-integration-10of10-followup-20260810

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/ha-integration-10of10-followup-20260810

      - name: Apply regression-test and CI contract fixes
        run: python .github/scripts/agent_ci_contract_fix.py

      - name: Commit atomic fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: align contracts with hardened behavior'
          git push origin HEAD:fix/ha-integration-10of10-followup-20260810
