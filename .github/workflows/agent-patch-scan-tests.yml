name: One-shot safe-scan test patch

on:
  push:
    branches: ["fix/ha-integration-hardening-20260810"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ha-integration-hardening-20260810

      - name: Patch stale safe-scan fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_scan_safe_mode.py")
          text = path.read_text()

          old_fixture = '''        self.device_client = SimpleNamespace(
              scan_uart_settings=False,
              effective_batch=effective_batch,
              timeout=10,
              retry=3,
              unknown_registers={},
              scanned_registers={},
              device_scan_result=None,
              config=SimpleNamespace(
                  host="192.168.1.10",
                  port=502,
                  slave_id=slave_id,
              ),
          )'''
          new_fixture = '''        self.device_client = SimpleNamespace(
              scan_uart_settings=False,
              effective_batch=effective_batch,
              timeout=10,
              retry=3,
              unknown_registers={},
              scanned_registers={},
              device_scan_result=None,
              _write_lock=asyncio.Lock(),
              async_disconnect=AsyncMock(),
              async_ensure_connected=AsyncMock(),
              config=SimpleNamespace(
                  host="192.168.1.10",
                  port=502,
                  slave_id=slave_id,
                  connection_type="tcp",
                  connection_mode="tcp",
                  serial_port=None,
                  baud_rate=9600,
                  parity="N",
                  stop_bits=1,
              ),
          )'''
          if text.count(old_fixture) != 1:
              raise SystemExit("safe-scan coordinator fixture did not match exactly once")
          text = text.replace(old_fixture, new_fixture)

          old_test = '''@pytest.mark.asyncio
          async def test_validate_known_registers_marks_missing_on_failure(monkeypatch):
              """Registers are marked missing when _call_modbus raises ConnectionException."""
              from pymodbus.exceptions import ConnectionException

              coord = _make_validate_coordinator()
              coord.device_client._call_modbus = AsyncMock(side_effect=ConnectionException("no connection"))
              hass = _make_hass()

              from custom_components.thessla_green_modbus import services as svc_mod

              monkeypatch.setattr(svc_mod, "_get_coordinator_from_entity_id", lambda _h, _e: coord)
              monkeypatch.setattr(svc_mod, "async_extract_entity_ids", lambda c: c.data["entity_id"])

              from custom_components.thessla_green_modbus.services import async_setup_services

              await async_setup_services(hass)
              handler = hass.services.handlers["validate_known_registers"]
              result = await handler(_make_call({"entity_id": ["climate.dev"]}))

              summary = result["climate.dev"]["summary"]
              assert summary["supported_count"] == 0
              assert summary["missing_count"] > 0'''
          new_test = '''@pytest.mark.asyncio
          async def test_validate_known_registers_marks_indeterminate_on_transport_failure(monkeypatch):
              """Transport failures are indeterminate and never proof that registers are missing."""
              from pymodbus.exceptions import ConnectionException

              coord = _make_validate_coordinator()
              coord.device_client._call_modbus = AsyncMock(side_effect=ConnectionException("no connection"))
              hass = _make_hass()

              from custom_components.thessla_green_modbus import services as svc_mod

              monkeypatch.setattr(svc_mod, "_get_coordinator_from_entity_id", lambda _h, _e: coord)
              monkeypatch.setattr(svc_mod, "async_extract_entity_ids", lambda c: c.data["entity_id"])

              from custom_components.thessla_green_modbus.services import async_setup_services

              await async_setup_services(hass)
              handler = hass.services.handlers["validate_known_registers"]
              result = await handler(_make_call({"entity_id": ["climate.dev"]}))

              summary = result["climate.dev"]["summary"]
              assert summary["supported_count"] == 0
              assert summary["missing_count"] == 0
              assert summary["indeterminate_count"] > 0'''
          if text.count(old_test) != 1:
              raise SystemExit("transport-failure validation test did not match exactly once")
          text = text.replace(old_test, new_test)

          path.write_text(text)
          PY

          ruff format tests/test_scan_safe_mode.py
          rm .github/workflows/agent-patch-scan-tests.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_scan_safe_mode.py .github/workflows/agent-patch-scan-tests.yml
          git diff --cached --check
          git commit -m "test(scan): align fixtures with isolated transport contract"
          git push origin HEAD:fix/ha-integration-hardening-20260810
