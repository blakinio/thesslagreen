name: Temporary hardening cleanup

on:
  push:
    branches:
      - fix/ha-integration-10of10-followup-20260810

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/ha-integration-10of10-followup-20260810

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Apply boundary and config-flow cleanup
        run: |
          python .github/scripts/agent_core_boundary_fix.py
          python .github/scripts/agent_core_boundary_fix2.py
          python .github/scripts/agent_configflow_fix.py

      - name: Fix generated boundary-test style
        run: >-
          python -c 'from pathlib import Path; p=Path("tests/test_domain_layer_boundaries.py"); s=p.read_text(encoding="utf-8"); old="                for module in modules:\n                    if module == \"homeassistant\" or module.startswith(\"homeassistant.\"):\n                        violations.append(f\"{path.relative_to(COMPONENT)} -> {module}\")\n"; new="                violations.extend(\n                    f\"{path.relative_to(COMPONENT)} -> {module}\"\n                    for module in modules\n                    if module == \"homeassistant\" or module.startswith(\"homeassistant.\")\n                )\n"; assert old in s; p.write_text(s.replace(old, new, 1), encoding="utf-8")'

      - name: Install validation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
          python -m pip install homeassistant==2026.2.3 hacs

      - name: Normalize and capture validation
        shell: bash
        run: |
          ruff check --fix --select I custom_components tests tools
          ruff format custom_components tests tools
          ruff check custom_components tests tools
          set +e
          mypy custom_components/thessla_green_modbus > docs/agents/tasks/.mypy-debug.txt 2>&1
          mypy_status=$?
          pytest -q \
            tests/test_domain_layer_boundaries.py \
            tests/test_device_client.py \
            tests/test_integration.py \
            tests/test_config_flow_stable_identity.py \
            tests/test_config_flow_user_duplicates.py \
            tests/test_config_flow_confirm.py \
            tests/test_config_flow_user.py > docs/agents/tasks/.focused-test-debug.txt 2>&1
          pytest_status=$?
          set -e
          printf '\nMYPY_EXIT=%s\n' "$mypy_status" >> docs/agents/tasks/.mypy-debug.txt
          printf '\nPYTEST_EXIT=%s\n' "$pytest_status" >> docs/agents/tasks/.focused-test-debug.txt
          cat docs/agents/tasks/.mypy-debug.txt
          cat docs/agents/tasks/.focused-test-debug.txt

      - name: Commit transformed workspace and diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: finish HA boundary and config-flow hardening'
          git push origin HEAD:fix/ha-integration-10of10-followup-20260810
