name: Temporary core boundary cleanup

on:
  push:
    branches:
      - fix/ha-integration-10of10-followup-20260810

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/ha-integration-10of10-followup-20260810

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Apply domain-boundary cleanup
        shell: bash
        run: |
          python .github/scripts/agent_core_boundary_fix.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_domain_layer_boundaries.py')
          text = path.read_text(encoding='utf-8')
          old = '''                for module in modules:
                    if module == "homeassistant" or module.startswith("homeassistant."):
                        violations.append(f"{path.relative_to(COMPONENT)} -> {module}")
'''
          new = '''                violations.extend(
                    f"{path.relative_to(COMPONENT)} -> {module}"
                    for module in modules
                    if module == "homeassistant" or module.startswith("homeassistant.")
                )
'''
          if old not in text:
              raise SystemExit('expected boundary-test block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install validation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
          python -m pip install homeassistant==2026.2.3 hacs

      - name: Normalize and validate
        run: |
          ruff check --fix --select I custom_components tests tools
          ruff format custom_components tests tools
          ruff check custom_components tests tools
          mypy custom_components/thessla_green_modbus
          pytest -q tests/test_domain_layer_boundaries.py tests/test_device_client.py tests/test_integration.py

      - name: Commit boundary cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(core): remove Home Assistant object coupling'
          git push origin HEAD:fix/ha-integration-10of10-followup-20260810
