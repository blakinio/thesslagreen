name: Ruff import debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  import-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: python -m pip install 'ruff==0.16.2'
      - name: Show import fix
        run: ruff check --select I --fix --diff tests/test_quality_scale_core_reads.py
