name: Temporary pymodbus floor sync

on:
  push:
    branches:
      - fix/ha-integration-10of10-followup-20260810

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/ha-integration-10of10-followup-20260810

      - name: Synchronize active dependency documentation
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          excluded_roots = {Path('docs/archive'), Path('docs/releases')}
          excluded_files = {Path('CHANGELOG.md')}
          changed = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              if path == Path('.github/workflows/agent-sync-pymodbus-floor.yml'):
                  continue
              if path in excluded_files or any(parent in path.parents for parent in excluded_roots):
                  continue
              if path.suffix.lower() not in {'.md', '.py', '.toml', '.txt', '.yaml', '.yml', '.json'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text.replace('pymodbus>=3.6.0', 'pymodbus>=3.6.1')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print('updated:', *changed, sep='\n- ')
          Path('.github/workflows/agent-sync-pymodbus-floor.yml').unlink()

      - name: Commit synchronized floor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: align active pymodbus minimum'
          git push origin HEAD:fix/ha-integration-10of10-followup-20260810
