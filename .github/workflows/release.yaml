name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "custom_components/thessla_green_modbus/manifest.json"
      - "CHANGELOG.md"

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub release from manifest version
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Require exact current main commit
        shell: bash
        run: |
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" != "$MAIN_SHA" ]; then
            echo "Release blocked: triggering SHA $GITHUB_SHA is not current main $MAIN_SHA" >&2
            exit 1
          fi

      - name: Require successful CI for exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repository = os.environ["REPOSITORY"]
          sha = os.environ["SHA"]
          token = os.environ["GH_TOKEN"]
          endpoint = (
              f"https://api.github.com/repos/{repository}/actions/workflows/ci.yaml/runs"
              f"?head_sha={quote(sha)}&event=push&per_page=100"
          )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2026-03-10",
              "User-Agent": "thesslagreen-release-gate",
          }
          deadline = time.monotonic() + 1200

          while True:
              request = Request(endpoint, headers=headers)
              with urlopen(request, timeout=30) as response:
                  payload = json.load(response)

              runs = [
                  run
                  for run in payload.get("workflow_runs", [])
                  if run.get("head_sha") == sha and run.get("event") == "push"
              ]
              successes = [
                  run
                  for run in runs
                  if run.get("status") == "completed" and run.get("conclusion") == "success"
              ]
              if successes:
                  run = max(successes, key=lambda item: item.get("run_attempt", 0))
                  print(
                      "Exact-commit CI gate passed: "
                      f"run {run.get('id')} for {sha} concluded success."
                  )
                  break

              active = [run for run in runs if run.get("status") != "completed"]
              if runs and not active:
                  conclusions = ", ".join(
                      f"{run.get('id')}={run.get('conclusion')}" for run in runs
                  )
                  print(
                      f"Release blocked: exact-commit CI has no successful run ({conclusions}).",
                      file=sys.stderr,
                  )
                  raise SystemExit(1)

              if time.monotonic() >= deadline:
                  print(
                      "Release blocked: timed out without successful exact-commit CI evidence.",
                      file=sys.stderr,
                  )
                  raise SystemExit(1)

              time.sleep(15)
          PY

      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import json
          from pathlib import Path

          manifest = Path("custom_components/thessla_green_modbus/manifest.json")
          version = json.loads(manifest.read_text(encoding="utf-8"))["version"]
          print(version)
          PY
          )

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid manifest version: $VERSION" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release notes from CHANGELOG
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")

          pattern = re.compile(
              rf"^## \[{re.escape(version)}\].*?(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(changelog)

          if match:
              notes = match.group(0).strip()
          else:
              notes = (
                  f"## v{version}\n\n"
                  "Release created from manifest.json version."
              )

          Path("release_notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Check if release tag already exists
        id: tag
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} does not exist; creating release."
          fi

      - name: Create GitHub release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          target_commitish: ${{ github.sha }}
