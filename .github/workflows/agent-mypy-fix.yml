name: Temporary strict mypy fix

on:
  push:
    branches:
      - fix/ha-integration-10of10-followup-20260810

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/ha-integration-10of10-followup-20260810

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Apply deterministic typing fixes
        run: python .github/scripts/agent_mypy_fix.py

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
          python -m pip install homeassistant==2026.2.3 hacs

      - name: Normalize formatting
        run: |
          ruff check --fix --select I custom_components tests tools
          ruff format custom_components tests tools
          ruff check custom_components tests tools

      - name: Verify strict mypy
        run: mypy custom_components/thessla_green_modbus

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(types): satisfy strict mypy gate'
          git push origin HEAD:fix/ha-integration-10of10-followup-20260810
