name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
        ha-version: ["2026.2.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
          python -m pip install homeassistant==${{ matrix.ha-version }} hacs

      - name: Ruff
        run: ruff check --output-format=github custom_components tests tools

      - name: Ruff import order
        run: ruff check --select I --output-format=github custom_components tests tools

      - name: Ruff format
        shell: bash
        run: |
          status=0
          output="$(ruff format --check custom_components tests tools 2>&1)" || status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              case "$line" in
                "Would reformat: "*)
                  file="${line#Would reformat: }"
                  echo "::error file=${file}::Ruff formatter would reformat this file"
                  ;;
              esac
            done <<< "$output"
            exit "$status"
          fi

      - name: Compile Python sources
        run: python -m compileall -q custom_components/thessla_green_modbus tests tools

      - name: Mypy
        run: mypy custom_components/thessla_green_modbus

      - name: Compare registers with vendor reference
        run: python tools/compare_registers_with_reference.py --show-renames

      - name: AirPack4 vendor coverage
        run: python tools/compare_airpack4_vendor_coverage.py

      - name: Check translations
        run: python tools/check_translations.py

      - name: Maintainability gate
        run: python tools/check_maintainability.py

      - name: Validate agent checkpoints
        run: python tools/agents/checkpoint.py --tasks docs/agents/tasks --require-checkpoint

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.13"]
        ha-version: ["2026.2.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
          python -m pip install homeassistant==${{ matrix.ha-version }} hacs

      - name: Collect tests
        run: pytest --collect-only -q

      - name: Pytest with coverage
        run: pytest tests/ -q --tb=long --cov --cov-report=term --cov-report=json:coverage.json

      - name: Report quality-scale coverage gaps
        if: always() && hashFiles('coverage.json') != ''
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = "custom_components/thessla_green_modbus/"
          report = json.loads(Path("coverage.json").read_text(encoding="utf-8"))
          gaps = []

          for path, record in sorted(report["files"].items()):
              if not path.startswith(root) or not path.endswith(".py"):
                  continue
              summary = record["summary"]
              percent = float(summary["percent_covered"])
              config_flow = path == f"{root}config_flow.py" or path.startswith(
                  f"{root}_config_flow/"
              )
              below_target = percent < 100.0 if config_flow else percent <= 95.0
              if not below_target:
                  continue
              gaps.append(
                  (
                      percent,
                      path,
                      "100%" if config_flow else ">95%",
                      record.get("missing_lines", []),
                      record.get("missing_branches", []),
                  )
              )

          total = report["totals"]["percent_covered"]
          print(
              f"::notice file=pyproject.toml::coverage total={total:.2f}%; "
              f"quality-scale module gaps={len(gaps)}"
          )
          for percent, path, required, missing_lines, missing_branches in sorted(gaps)[:45]:
              lines = ",".join(str(line) for line in missing_lines[:60]) or "none"
              branches = json.dumps(missing_branches[:40], separators=(",", ":"))
              print(
                  f"::warning file={path}::coverage={percent:.2f}% required={required}; "
                  f"missing_lines={lines}; missing_branches={branches}"
              )
          if len(gaps) > 45:
              print(
                  f"::warning file=pyproject.toml::coverage diagnostics truncated: "
                  f"showing 45 of {len(gaps)} module gaps"
              )
          PY

  minimum-ha:
    name: Minimum HA API contracts (2026.1.0)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install minimum supported Home Assistant
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio
          python -m pip install -e .
          python -m pip install homeassistant==2026.1.0

      - name: Verify config-entry-only schema
        run: |
          python - <<'PY'
          from custom_components.thessla_green_modbus import CONFIG_SCHEMA
          assert CONFIG_SCHEMA is not None
          PY

      - name: Run minimum-version framework contracts
        run: |
          pytest --noconftest -q \
            tests/test_service_target_contract.py \
            tests/test_integration_service_lifecycle.py \
            tests/test_repairs.py \
            tests/test_write_repair_lifecycle.py

  current-ha:
    name: Current HA API contracts (2026.8.1)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install current stable Home Assistant
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio
          python -m pip install -e .
          python -m pip install homeassistant==2026.8.1

      - name: Run current-version framework contracts
        run: |
          pytest --noconftest -q \
            tests/test_service_target_contract.py \
            tests/test_integration_service_lifecycle.py \
            tests/test_repairs.py \
            tests/test_write_repair_lifecycle.py

  pymodbus-compatibility:
    name: pymodbus ${{ matrix.pymodbus-version }} compatibility
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        pymodbus-version: ["3.6.1", "3.14.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install compatibility stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio homeassistant==2026.2.3
          python -m pip install -e .
          python -m pip install --force-reinstall "pymodbus==${{ matrix.pymodbus-version }}"
          python - <<'PY'
          import pymodbus
          print("pymodbus", pymodbus.__version__)
          PY

      - name: Run transport contract tests
        run: |
          pytest --noconftest -q \
            tests/test_modbus_transport_tcp.py \
            tests/test_modbus_transport_rtu.py \
            tests/test_modbus_transport_raw.py

  entity-mappings:
    name: Entity mappings validation
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.13"]
        ha-version: ["2026.2.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
          python -m pip install homeassistant==${{ matrix.ha-version }} hacs

      - name: Validate entity mappings
        run: python tools/validate_entity_mappings.py

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
