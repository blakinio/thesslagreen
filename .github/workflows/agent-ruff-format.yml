name: Temporary Ruff format

on:
  push:
    branches:
      - fix/ha-integration-10of10-followup-20260810

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/ha-integration-10of10-followup-20260810

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install Ruff
        run: python -m pip install 'ruff==0.12.7'

      - name: Apply repository formatter
        run: ruff format custom_components tests tools

      - name: Commit formatter output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components tests tools
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No formatter changes required'
            exit 0
          fi
          git commit -m 'style: apply repository Ruff formatter'
          git push origin HEAD:fix/ha-integration-10of10-followup-20260810
