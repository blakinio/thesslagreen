version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # pytest-homeassistant-custom-component 0.13.309-0.13.316 pins pydantic==2.12.2.
      # A direct pydantic bump to 2.13.4 broke CI (#1741) and was reverted (#1743).
      # Keep pydantic locked to the HA test plugin's pin; only move it when the plugin's
      # supported range moves (it will pull the compatible pydantic along with it).
      # Ignore direct minor/patch pydantic bumps so this invalid PR stops recurring.
      - dependency-name: "pydantic"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # pytest-homeassistant-custom-component 0.13.309-0.13.316 pins aiodiscover==3.2.3,
      # and aiodiscover>=3.3.0 needs aiodns>=4.0.4 while Home Assistant 2026.2.x pins
      # aiodns==4.0.0, so #1780 (aiodiscover>=3.3.2) could not resolve in CI. Drop this
      # ignore when the HA test plugin range moves past those pins.
      - dependency-name: "aiodiscover"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
